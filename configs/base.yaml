loss:
  name: CategoricalCrossentropy
  reduction: none
  from_logits: true

audio:
  duration: 0.3
  sample_rate: 8000
  segment_length: 2400

model:
  id: mossong_plus
  pretrained_weights: null
  output_activation: null
  bn_conv1: true
  bn_conv2: true
  bn_conv3: true
  bn_dense1: false
  bn_dense2: false

training_mode: pretrain

train:
  epochs: 1000
  shuffle: true
  batch_size: 128
  warmup_epochs: 15
  warmup_augment_p: 0

optimizer:
  name: Adam
  learning_rate: 0.001

labels:
  Ae_aegypti_Female: 0
  Ae_aegypti_Male: 1
  Ae_albopictus_Female: 2
  Ae_albopictus_Male: 3
  An_dirus_Female: 4
  An_dirus_Male: 5
  An_minimus_Female: 6
  An_minimus_Male: 7
  Cx_quin_Female: 8
  Cx_quin_Male: 9
  No.mos: 10

dataset:
  train_dir: dataset/MSB/Indoor
  indoor: dataset/MSB/Indoor
  mosLab: dataset/Philip
  outdoor: dataset/MSB/Outdoor
  val_dir: null
  test_dir: null
  manifest_sha256: null

  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1

adabn:
    enabled: false
    target_dir: "dataset/MSB/Outdoor"

ssl:
  enabled: false
  method: "fixmatch"
  tau: 0.95
  lambda_u: 1.0
  mapping: "convex"
  source_dir: "dataset/MSB/Indoor"
  target_dir: "dataset/MSB/Outdoor"
  train_samples_per_class: 100
  val_samples_per_class: 50
  test_samples_per_class: 50

preprocess:
  dc_removal: true

augment:
  mixup:
    p: 1
    alpha: 0.4

  rms_norm:
    p: 1
    max_gain: 15
    min_gain: 0.05
    target_rms: 0.05

  high_pass:
    p: 0
    fc: 150

  time_shift:
    p: 0
    rate:
      - -0.05
      - 0.05

  pitch_shift:
    p: 0
    semitones:
      - -0.2
      - 0.2

  random_gain:
    p: 0.3
    gain_db:
      - -3
      - 3

  noise_overlay:
    p: 0.2
    snr_db:
      - 15
      - 30
    post_gain_db:
      - -3
      - 3
    envelope_gain:
      - 0.7
      - 1

  gaussian_noise:
    p: 0
    snr_db:
      - 20
      - 50

  noise_banks:
    - dataset/MSB/Environmental/humbug_noises
    - dataset/MSB/Environmental/inmp_noises
    - dataset/MSB/Environmental/miru_noises
    - dataset/MSB/Environmental/noises
    - dataset/MSB/Environmental/Nomos

  segment_overlap:
    val: 0.5
    train:
      - 0
      - 0.8

  max_segments_per_file: 100

class_weights:
  mode: auto
  values:
    - 1
    - 1.25
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1.25
    - 1

callbacks:
  early_stopping:
    mode: max
    monitor: val_macro_f1
    patience: 80
    min_delta: 0
    restore_best_weights: true

  model_checkpoint:
    mode: max
    monitor: val_macro_f1
    min_delta: 0
    save_best_only: true
    save_weights_only: true

  reduce_lr_on_plateau:
    mode: max
    monitor: val_macro_f1
    factor: 0.5
    patience: 30
    min_delta: 0.001
    min_lr: 3.0e-05
    restore_best_weights: true

evaluation:
  sample_level:
    enabled: true
  file_level:
    enabled: false

performance:
  precision: float32
  steps_per_call: 20
  jit_compile: false

  profiler:
    enabled: false
    start_step: 10
    num_steps: 10

cache:
  enabled: true
  schema_version: 2
  root: null

reproducibility:
  enabled: true
  seed: 48
  deterministic_ops: true
  deterministic_data: true

runtime:
  root: runtime
  experiments_dir: models/experiments

export:
  out_dir: quantization_output
  representative_samples: 500
  input_amplitude_range: 0.03
  allow_dummy_calibration: false
  run_debugger: false

logging:
  console: normal
  epoch_interval: 1
  model_summary: false
  classification_report: file
  jsonl: true

wandb:
  project: MosSongPlus
  tags:
    - 11class
    - nomos
    - indoor
    - bestaug
    - indoor_best_observed
    - seed48
    - batch128
    - overlay022
    - mixup04
  group: 11class-indoor-best-observed
  notes: "Best observed 11-class Indoor pretrain config from W&B: batch128 lr1e-3 seed48 mixup alpha0.4 overlay0.22 random_gain0.3."
  enabled: false
  job_type: train
  log_weights_freq: 0
  aggregate_plot_freq: 0
  log_prediction_audio: false
  prediction_table_max_rows: 0
